# TenebraOS Calamares settings (Calamares 3.3.x, Qt6)
---
# Search paths for custom modules shipped by tenebra-calamares
modules-search:
    - /usr/share/calamares/modules
    - /usr/lib/calamares/modules

# profileselect is a custom-named instance of the stock packagechooser
# view module (PythonQt view modules no longer exist in Calamares 3.3).
# It stores its choice in global storage as "packagechooser_profileselect".
instances:
    - id: profileselect
      module: packagechooser
      config: profileselect.conf

branding: tenebra

prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: true

requirements:
    requiredStorage: 15
    requiredRam: 2.0

sequence:
    - show:
        - welcome
        - packagechooser@profileselect
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - hardwaredetect
        - networkcfg
        - hwclock
        - grubcfg
        - bootloader
        - initramfscfg
        - initramfs
        - autoconfig
        - umount
    - show:
        - finished
