# keyboard — X11 + console layout
# convertedKeymapPath points at Devuan's kbd keymaps (not the
# systemd-era /usr/lib path); the kbd package places them here.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"

# Debian/Devuan system: write /etc/default/keyboard
# (auto-detected as true, kept explicit for clarity)
writeEtcDefaultKeyboard: true