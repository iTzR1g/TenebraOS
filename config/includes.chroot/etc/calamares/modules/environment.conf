# Environment chooser — CachyOS-style desktop/window-manager selection.
# Stock packagechooser module under a custom instance named "environment"
# (see settings.conf instances). method: legacy stores the chosen item id
# in global storage as "packagechooser_environment"; the autoconfig job
# reads that key inside the install chroot and installs/configures the
# corresponding desktop (over the network, from Devuan + TenebraOS repos).
#
# Plasma ships in the ISO (offline). The other environments are pulled
# during the install, so a working network connection is required for them.
---                           
mode: optional
method: legacy

default: plasma

labels:
    step: "Desktop Environment"
    description: "Pick the desktop environment or window manager. KDE Plasma is preinstalled and configured; the rest are fetched during installation."

items:
    - id: plasma
      name: KDE Plasma
      description: "Full KDE Plasma desktop (X11). Ships with the installer, works offline, tuned for daily use. Recommended."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
      # preselected: true
    - id: xfce
      name: XFCE
      description: "Lightweight classic desktop (X11). Fast on modest hardware, familiar layout. Installed during setup."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
    - id: i3
      name: i3
      description: "Minimal tiling window manager (X11). Keyboard-driven, extremely light. Installed during setup."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
    - id: sway
      name: Sway
      description: "i3-compatible Wayland compositor. Modern, GPU-accelerated tiling. Installed during setup."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
    - id: minimal
      name: No Desktop
      description: "Boot to a text console only. No display manager or graphical environment is configured."
      screenshot: /usr/share/calamares/branding/tenebra/background.png