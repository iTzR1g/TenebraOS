# Profile chooser — stock packagechooser module under a custom instance
# named "profileselect" (see settings.conf instances).
#
# method: legacy writes the selected item id into global storage as
#   "packagechooser_profileselect"; the autoconfig job reads that key.
---
mode: required
method: legacy

default: office

labels:
    step: "Experience & Hardware"
    description: "Your hardware was auto-detected. Pick how you'll use the system — this also confirms the detected setup."

items:
    - id: gaming
      name: Gaming
      description: "Games and entertainment: Steam, Lutris, Heroic, Wine, Discord and performance tools. Full GPU acceleration enabled where detected."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
    - id: learning
      name: Learning & Development
      description: "Study and programming: VS Code, Python, Node.js, Jupyter and virtualization tools."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
    - id: office
      name: Daily Use & Office
      description: "Everyday desktop: LibreOffice, Thunderbird, GIMP and Inkscape. Conservative — sticks to open drivers."
      screenshot: /usr/share/calamares/branding/tenebra/background.png
