# partition — default layout for TenebraOS
# EFI at /boot/efi (Debian/Devuan convention), ext4 default.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# No swap partition by default — TenebraOS uses zram (see t2 config)
userSwapChoices:
    - none
    - file
    - small
    - suspend

luksGeneration: luks1
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType:  "ext4"
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true