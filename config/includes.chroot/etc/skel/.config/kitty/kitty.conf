# TenebraOS Kitty Terminal Configuration
# /etc/skel/.config/kitty/kitty.conf

# ─── Font ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        11.0

# ─── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

# ─── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines 10000

# ─── Mouse ───────────────────────────────────────────────────────────────────
copy_on_select        clipboard
mouse_hide_wait       3.0
url_style             curly

# ─── Performance ─────────────────────────────────────────────────────────────
repaint_delay    6
input_delay      1
sync_to_monitor  yes

# ─── Window ──────────────────────────────────────────────────────────────────
window_padding_width  4
hide_window_decorations no
confirm_os_window_close 1

# ─── Tabs ────────────────────────────────────────────────────────────────────
tab_bar_edge   bottom
tab_bar_style  powerline
tab_powerline_style slanted

# ─── Colors (TenebraOS Dark Theme) ──────────────────────────────────────────
# Base colors
foreground           #f8f9fa
background           #1a1a2e
selection_foreground  #1a1a2e
selection_background  #e94560

# Cursor colors
cursor               #e94560
cursor_text_color    #1a1a2e

# URL underline color when hovering with mouse
url_color            #e94560

# Tab bar colors
active_tab_foreground   #1a1a2e
active_tab_background   #e94560
inactive_tab_foreground #f8f9fa
inactive_tab_background #16213e

# Normal colors
color0  #1a1a2e
color1  #e94560
color2  #51cf66
color3  #ffd43b
color4  #339af0
color5  #cc5de8
color6  #22b8cf
color7  #f8f9fa

# Bright colors
color8  #495057
color9  #ff6b6b
color10 #69db7c
color11 #ffe066
color12 #4dabf7
color13 #da77f2
color14 #3bc9db
color15 #f1f3f5

# ─── URL Matching ────────────────────────────────────────────────────────────
url_prefixes  http:// https:// file:// ftp://
detect_urls    yes

# ─── Keyboard Shortcuts ──────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
