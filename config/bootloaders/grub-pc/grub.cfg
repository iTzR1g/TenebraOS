set default="0"
# Boot straight into the live session; hold Shift/Esc at boot to interrupt
set timeout=0

loadfont unicode

set gfxmode=1920x1080
set gfxpayload=keep

insmod vbe
insmod vga
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

set theme=${prefix}/themes/tenebra/theme.txt

export theme

menuentry "Tenebra Live" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash
    initrd /live/initrd.img
}

menuentry "Tenebra Live (Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash
    initrd /live/initrd.img
}

menuentry "Boot from first hard disk" {
    insmod chain
    insmod ntfs
    set root=(hd0)
    chainloader +1
}
