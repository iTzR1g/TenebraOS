set default="0"
set timeout=5

loadfont unicode

set gfxmode=1920x1080
set gfxpayload=keep

insmod efi_gop
insmod efi_uga
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

set theme=${prefix}/themes/tenebra/theme.txt

export theme

menuentry "Tenebra Live" {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "Tenebra Live (Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash
    initrd /live/initrd.img
}

menuentry "Boot from first hard disk" {
    insmod chain
    insmod ntfs
    set root=(hd0)
    chainloader +1
}
